services:
  # ⚠️ 运维备注：backend 容器重建后 IP 会变化，而 nginx 在启动时缓存 upstream IP，
  # 因此 recreate backend 后必须执行 docker restart deploy-nginx-1（2026-09-04 502 事故教训）
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    # 显式命名镜像，worker 复用时引用不再隐式依赖 compose 项目名
    image: deploy-backend
    restart: always
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      # 代码热挂载：SCP 更新后只需 restart，无需 rebuild
      - /opt/molin-wiki/backend:/app
      # 以下子路径覆盖上面的大挂载（Docker 优先用更具体的挂载）
      - ../backend/data:/app/data
      - ../backend/.env:/app/.env:ro
    environment:
      # v2.0 §2.3: web 进程不再内嵌 worker 线程，由独立 worker service 消费队列
      TIBA_EMBEDDED_WORKER: "false"
      # .env 里的 localhost 只适用于本地宿主机开发；容器内必须走 compose 服务名。
      # 环境变量优先于 .env（pydantic-settings 顺序），此前容器内连 localhost:6333
      # 失败被静默吞掉 → 知识库搜索/图像搜索在生产返回 0 条（2026-09-22 修复）
      QDRANT_URL: http://qdrant:6333
    depends_on:
      qdrant:
        condition: service_started

  # v2.0 §2.3: 独立题跋分析 worker（CV/LLM 重任务与 web 进程隔离）
  # 复用 backend 的现成镜像（代码经 volume 热挂载一致），避免重复构建 2GB+ 依赖
  worker:
    image: deploy-backend
    restart: always
    command: ["python", "-m", "app.worker_main"]
    environment:
      QDRANT_URL: http://qdrant:6333
    volumes:
      - /opt/molin-wiki/backend:/app
      - ../backend/data:/app/data
      - ../backend/.env:/app/.env:ro
    depends_on:
      qdrant:
        condition: service_started

  qdrant:
    # 锁版：latest 曾从 v1.9 一路漂到 v1.17；升级需手动改版本并验证数据兼容
    image: qdrant/qdrant:v1.17.1
    restart: always
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      # beizitie/zi2anki 反代 host.docker.internal:3001 需要（宿主机网关）
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/molin-wiki/ssl:/etc/nginx/ssl:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot
      - /opt/molin-wiki/frontend/dist:/opt/molin-wiki/frontend/dist:ro
      - /opt/molin-wiki/backend/data:/opt/molin-wiki/backend/data:ro

volumes:
  qdrant_data:
  certbot_www:
